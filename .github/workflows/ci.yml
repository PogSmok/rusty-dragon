name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  RUSTFLAGS: "-D warnings"

jobs:
  # ---------------------------------------------------------------- static
  fmt:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with: { components: rustfmt }
      - run: cargo fmt --all -- --check

  clippy:
    strategy:
      fail-fast: false
      matrix:
        include:
          # Baseline target: `pext` has no effect, magic backend.
          - { name: magic, target-flags: "", args: "--all-features" }
          # BMI2 target with `pext`: the only row that lints the PEXT code.
          - { name: pext, target-flags: "-C target-cpu=x86-64-v3", args: "--features pext" }
    name: clippy (${{ matrix.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      RUSTFLAGS: "-D warnings ${{ matrix.target-flags }}"
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with: { components: clippy }
      - uses: Swatinem/rust-cache@v2
        with: { save-if: "${{ github.ref == 'refs/heads/main' }}" }
      - run: cargo clippy --all-targets --locked ${{ matrix.args }} -- -D warnings

  msrv:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      # Read the MSRV from `rust-version` in Cargo.toml, so it's never out of sync.
      - name: Read MSRV
        id: msrv
        run: |
          version=$(sed -n 's/^rust-version *= *"\(.*\)"/\1/p' Cargo.toml)
          if [ -z "$version" ]; then echo "::error::no rust-version in Cargo.toml"; exit 1; fi
          echo "Rust MSRV: $version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@master
        with: { toolchain: "${{ steps.msrv.outputs.version }}" }
      - uses: Swatinem/rust-cache@v2
        with: { save-if: "${{ github.ref == 'refs/heads/main' }}" }
      - run: cargo check --all-targets --locked
      - run: cargo check --all-targets --locked --all-features

  docs:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: magic, target-flags: "", args: "" }
          - { name: pext, target-flags: "-C target-cpu=x86-64-v3", args: "--features pext" }
    name: docs (${{ matrix.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      RUSTFLAGS: "-D warnings ${{ matrix.target-flags }}"
      RUSTDOCFLAGS: "-D warnings ${{ matrix.target-flags }}"
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with: { save-if: "${{ github.ref == 'refs/heads/main' }}" }
      - run: cargo doc --no-deps --document-private-items --locked ${{ matrix.args }}

  # --------------------------------------------------------------- dynamic
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, backend: magic, release: true }
          - { os: ubuntu-latest, backend: pext, target-flags: "-C target-cpu=x86-64-v3", args: "--features pext", release: true }
          # BMI2 target without the feature: proves PEXT is opt-in.
          - { os: ubuntu-latest, backend: magic, name: bmi2-no-pext, target-flags: "-C target-cpu=x86-64-v3" }
          - { os: windows-latest, backend: magic }
          - { os: windows-latest, backend: pext, target-flags: "-C target-cpu=x86-64-v3", args: "--features pext" }
          # Non-x86 targets: `pext` is ignored, always the magic backend.
          - { os: ubuntu-24.04-arm, backend: magic, args: "--features pext" }
          - { os: macos-latest, backend: magic }
    name: test (${{ matrix.os }}, ${{ matrix.name || matrix.backend }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      RUSTFLAGS: "-D warnings ${{ matrix.target-flags }}"
      RUSTDOCFLAGS: "${{ matrix.target-flags }}"
      RUSTY_DRAGON_EXPECTED_SLIDER_BACKEND: ${{ matrix.backend }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with: { save-if: "${{ github.ref == 'refs/heads/main' }}" }
      - run: cargo test --all-targets --locked ${{ matrix.args }}
      - run: cargo test --doc --locked ${{ matrix.args }}
      # Fat LTO is slow, so only run the optimized build once per backend.
      - name: Optimized tests with debug assertions
        if: matrix.release
        run: cargo test --profile release-checked --locked ${{ matrix.args }}
      - name: Build and run shipping binary
        if: matrix.release
        run: |
          cargo build --release --locked ${{ matrix.args }}
          ./target/release/rusty-dragon

  ci-ok:
    if: always()
    needs: [fmt, clippy, msrv, docs, test]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
      - run: echo "All CI jobs passed."
